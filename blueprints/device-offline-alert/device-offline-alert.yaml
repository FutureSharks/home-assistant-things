blueprint:
  name: Device Offline Alert
  description: >
    Sends a notification to the Home Assistant Companion app when a device
    goes offline, and optionally when it comes back. Works with any
    integration that marks a device's entities as unavailable when Home
    Assistant can't reach it (Reolink, Zigbee, Z-Wave, Wi-Fi devices and most
    others). Pick one entity per device; picking several entities from the
    same device gives duplicate alerts.
  domain: automation
  author: max.williams
  source_url: https://github.com/FutureSharks/home-assistant-things/blob/main/blueprints/device-offline-alert/device-offline-alert.yaml
  input:
    entities:
      name: Entities
      description: >
        One entity from each device to watch, for example a camera stream,
        a sensor or a switch. Avoid entities that are disabled.
      selector:
        entity:
          multiple: true

    notify_device:
      name: Phone
      description: The Companion app device to notify.
      selector:
        device:
          integration: mobile_app

    offline_for:
      name: Offline for
      description: >
        How long a device must be unreachable before alerting. Avoids alerts
        for short network blips and Home Assistant restarts.
      default:
        minutes: 5
      selector:
        duration:

    notify_back_online:
      name: Notify when back online
      description: Also send a notification when a device that triggered an alert recovers.
      default: true
      selector:
        boolean:

    time_sensitive:
      name: Time sensitive (iOS)
      description: Lets the notification break through Focus modes.
      default: true
      selector:
        boolean:

mode: queued
max: 10

variables:
  offline_for: !input offline_for
  notify_back_online: !input notify_back_online
  time_sensitive: !input time_sensitive
  offline_seconds: >
    {{ (offline_for.days | default(0)) * 86400
       + (offline_for.hours | default(0)) * 3600
       + (offline_for.minutes | default(0)) * 60
       + (offline_for.seconds | default(0)) }}
  device_name: >
    {{ device_attr(device_id(trigger.entity_id), 'name_by_user')
       or device_attr(device_id(trigger.entity_id), 'name')
       or state_attr(trigger.entity_id, 'friendly_name')
       or trigger.entity_id }}
  interruption_level: "{{ 'time-sensitive' if time_sensitive else 'active' }}"

triggers:
  - trigger: state
    id: offline
    entity_id: !input entities
    to: unavailable
    for: !input offline_for
  - trigger: state
    id: online
    entity_id: !input entities
    from: unavailable

conditions:
  - condition: or
    conditions:
      - condition: trigger
        id: offline
      # Only report recovery if the outage lasted long enough to have been
      # alerted on. This also skips the brief unavailable state at startup.
      - condition: template
        value_template: >
          {{ trigger.id == 'online'
             and notify_back_online
             and trigger.to_state.state not in ['unavailable', 'unknown']
             and (trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds() >= offline_seconds }}

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: offline
        sequence:
          - domain: mobile_app
            type: notify
            device_id: !input notify_device
            title: "⚠️ {{ device_name }} offline"
            message: >
              {{ device_name }} has been unreachable since
              {{ as_local(trigger.to_state.last_changed).strftime('%H:%M') }}.
            data:
              tag: "device-offline-{{ trigger.entity_id }}"
              push:
                interruption-level: "{{ interruption_level }}"
    default:
      - domain: mobile_app
        type: notify
        device_id: !input notify_device
        title: "✅ {{ device_name }} back online"
        message: >
          {{ device_name }} is reachable again after
          {{ ((trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds() / 60) | round(0) | int }} min.
        data:
          tag: "device-offline-{{ trigger.entity_id }}"
