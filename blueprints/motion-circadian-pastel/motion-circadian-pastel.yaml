blueprint:
  name: Presence Activiated Circadian Pastel Light
  description: >
    Turns a light on when a motion (binary) sensor detects presence and off
    when motion clears. While on, the light cycles through 12 pastel colours and
    warm whites that track the time of day between 05:00 and 20:00, moving through
    the palette from warm pastel hues in the early morning to cool whites by the
    end of the day. The colour is refreshed both when motion is detected and
    periodically, so a light left on during a long presence still follows the
    daily colour arc.
  domain: automation
  author: max.williams
  input:
    motion_sensor:
      name: Motion Sensor
      description: The binary sensor used to detect motion / presence.
      selector:
        entity:
          domain: binary_sensor

    rgb_light:
      name: RGB Light
      description: The RGB light entity to control.
      selector:
        entity:
          domain: light

    brightness_pct:
      name: Brightness (%)
      description: Brightness the light is turned on at.
      default: 80
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
          mode: slider

    no_motion_wait:
      name: No Motion Wait (minutes)
      description: How long to wait after motion clears before turning the light off.
      default: 2
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: minutes
          mode: box

    refresh_interval:
      name: Colour Refresh Interval (minutes)
      description: >
        How often the colour is re-evaluated while the light is on, so it keeps
        tracking the time of day. Use the /N format, e.g. /5 for every 5 minutes.
      default: /5
      selector:
        select:
          options:
            - label: Every 1 minute
              value: /1
            - label: Every 2 minutes
              value: /2
            - label: Every 5 minutes
              value: /5
            - label: Every 10 minutes
              value: /10
            - label: Every 15 minutes
              value: /15
            - label: Every 30 minutes
              value: /30

mode: queued
max: 3

triggers:
  - trigger: state
    entity_id: !input motion_sensor
    to: "on"
    id: motion_on
  # Fires only once the sensor has been continuously clear for the wait period.
  # Motion returning during the wait cancels the pending trigger automatically.
  - trigger: state
    entity_id: !input motion_sensor
    to: "off"
    for:
      minutes: !input no_motion_wait
    id: motion_off
  - trigger: time_pattern
    minutes: !input refresh_interval
    id: refresh

variables:
  _motion_sensor: !input motion_sensor
  _rgb_light: !input rgb_light
  _brightness_pct: !input brightness_pct

  # Day window and palette definition.
  day_start_min: 300      # 05:00
  day_end_min: 1200       # 20:00
  # Pastel colours to cycle through over the course of the day.
  palette:
    # light pink
    - hs_color: [350, 20]
      color_temp_kelvin: none
    # light pink/purple
    - hs_color: [300, 22]
      color_temp_kelvin: none
    # light blue
    - hs_color: [220, 26]
      color_temp_kelvin: none
    # blue
    - hs_color: [160, 20]
      color_temp_kelvin: none
    # light green
    - hs_color: [80, 35]
      color_temp_kelvin: none
    # light yellow
    - hs_color: [40, 70]
      color_temp_kelvin: none
    # cool white
    - hs_color: none
      color_temp_kelvin: 6500
    # neutral white
    - hs_color: none
      color_temp_kelvin: 4000
    # warm white
    - hs_color: none
      color_temp_kelvin: 3000
    # yellow
    - hs_color: none
      color_temp_kelvin: 2000
    # orange
    - hs_color: [22, 80]
      color_temp_kelvin: none
    # red
    - hs_color: [10, 90]
      color_temp_kelvin: none

  now_min: "{{ now().hour * 60 + now().minute }}"
  # Clamp into the day window, then map onto the palette slots.
  clamped_min: "{{ [[now_min, day_start_min] | max, day_end_min] | min }}"
  slot_size: "{{ (day_end_min - day_start_min) / (palette | length) }}"
  colour_index: "{{ [((clamped_min - day_start_min) / slot_size) | int, (palette | length) - 1] | min }}"
  current_colour: "{{ palette[colour_index] }}"
  # Whether this palette slot is a pastel hue or a warm/cool white.
  use_hs: "{{ current_colour.hs_color != 'none' }}"

actions:
  - choose:
      # Motion has been clear for the wait period: turn the light off.
      - conditions:
          - condition: trigger
            id: motion_off
        sequence:
          - action: light.turn_off
            target:
              entity_id: !input rgb_light

      # Motion detected: turn the light on with the current pastel colour.
      - conditions:
          - condition: trigger
            id: motion_on
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ use_hs }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: !input rgb_light
                    data:
                      brightness_pct: !input brightness_pct
                      hs_color: "{{ current_colour.hs_color }}"
            default:
              - action: light.turn_on
                target:
                  entity_id: !input rgb_light
                data:
                  brightness_pct: !input brightness_pct
                  color_temp_kelvin: "{{ current_colour.color_temp_kelvin }}"

      # Periodic refresh: only update colour if the light is already on.
      - conditions:
          - condition: trigger
            id: refresh
          - condition: state
            entity_id: !input rgb_light
            state: "on"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ use_hs }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: !input rgb_light
                    data:
                      hs_color: "{{ current_colour.hs_color }}"
            default:
              - action: light.turn_on
                target:
                  entity_id: !input rgb_light
                data:
                  color_temp_kelvin: "{{ current_colour.color_temp_kelvin }}"
