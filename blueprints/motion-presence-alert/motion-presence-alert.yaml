blueprint:
  name: Motion / Presence Alert
  description: >
    Sends a notification to the Home Assistant Companion app when any of the
    chosen motion, occupancy or presence sensors detects something, with a
    cooldown so a busy sensor doesn't flood your phone. Works with Reolink
    person, vehicle, animal and motion sensors as well as any other binary
    sensor.
  domain: automation
  author: max.williams
  source_url: https://github.com/FutureSharks/home-assistant-things/blob/main/blueprints/motion-presence-alert/motion-presence-alert.yaml
  input:
    sensors:
      name: Sensors
      description: Binary sensors that should trigger a notification when they turn on.
      selector:
        entity:
          multiple: true
          filter:
            - domain: binary_sensor

    notify_device:
      name: Phone
      description: The Companion app device to notify.
      selector:
        device:
          integration: mobile_app

    cooldown:
      name: Cooldown
      description: >
        Minimum time between notifications, counted from the last one sent.
        Detections during the cooldown are ignored. Set to 0 to notify on
        every detection. The cooldown is shared by all sensors in this
        automation; to throttle areas separately, create one automation per
        area.
      default:
        minutes: 5
      selector:
        duration:

    time_sensitive:
      name: Time sensitive (iOS)
      description: Lets the notification break through Focus modes.
      default: false
      selector:
        boolean:

# single: two sensors firing together can't both get past the cooldown check
# before last_triggered updates.
mode: single
max_exceeded: silent

variables:
  cooldown: !input cooldown
  time_sensitive: !input time_sensitive
  cooldown_seconds: >
    {{ (cooldown.days | default(0)) * 86400
       + (cooldown.hours | default(0)) * 3600
       + (cooldown.minutes | default(0)) * 60
       + (cooldown.seconds | default(0)) }}
  sensor_name: >
    {{ state_attr(trigger.entity_id, 'friendly_name') or trigger.entity_id }}
  area: "{{ area_name(trigger.entity_id) or '' }}"
  interruption_level: "{{ 'time-sensitive' if time_sensitive else 'active' }}"

triggers:
  - trigger: state
    entity_id: !input sensors
    from: "off"
    to: "on"

conditions:
  # last_triggered only updates when the actions run, so detections ignored
  # during the cooldown don't extend it. It also survives restarts.
  - condition: template
    value_template: >-
      {{ this.attributes.last_triggered is none
         or (now() - this.attributes.last_triggered).total_seconds() >= cooldown_seconds }}

actions:
  - domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: "🚶 {{ sensor_name }}"
    message: >
      Detected{{ ' in ' ~ area if area }} at {{ now().strftime('%H:%M') }}.
    data:
      group: motion-presence-alert
      tag: "motion-{{ trigger.entity_id }}"
      push:
        interruption-level: "{{ interruption_level }}"
